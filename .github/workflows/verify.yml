name: Library verification and release
on:
  pull_request:
  push:
    branches: [main, ci/reporting-failure]
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      REPORTING_FAILURE_FIXTURE: ${{ github.ref == 'refs/heads/ci/reporting-failure' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match mounted checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - name: Publish individual test results and summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Library tests (${{ matrix.runner }})
          path: artifacts/tests.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Publish test check
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Library tests (${{ matrix.runner }})
          path: artifacts/tests.xml
          reporter: python-xunit
          use-actions-summary: 'false'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-reports-${{ matrix.runner }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - run: task package
      - run: task smoke
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: library-packages-${{ matrix.runner }}
          path: dist/
          retention-days: 30
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v4.2.1
    with:
      draft-release: true
  publish:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task package
      - run: task smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packages
          path: dist/
          retention-days: 30
      - name: Attach all assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*.deb dist/SHA256SUMS
      - name: Publish tested draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
