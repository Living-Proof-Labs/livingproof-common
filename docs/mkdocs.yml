site_name: Living Proof Labs common library
site_url: https://docs.livingprooflabs.com/livingproof-common/
repo_url: https://github.com/Living-Proof-Labs/livingproof-common
use_directory_urls: false
strict: true
theme:
  name: zensical
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Documentation home: https://docs.livingprooflabs.com/
  - Start here: index.md
  - Guides:
      - Consumer usage: usage.md
  - Reference:
      - API: api.md
      - Tasks: tasks.md
  - Scenarios and results: scenarios.md
  - Verification: verification.md
  - Contribute: contribute.md
  - Version and source: provenance.md
  - Publication:
      - Pages activation: pages.md
      - Search compatibility: search.md
