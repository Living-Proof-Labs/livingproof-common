site_name: Living Proof Labs common library
site_url: https://docs.livingprooflabs.com/livingproof-common/
repo_url: https://github.com/Living-Proof-Labs/livingproof-common
use_directory_urls: false
strict: true
theme:
  name: zensical
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Start here: index.md
  - Consumer usage: usage.md
  - API reference: api.md
  - Executable scenarios: scenarios.md
  - Contributor tasks: tasks.md
  - Verification and gaps: verification.md
  - Build context: provenance.md
  - Pages activation: pages.md
  - Search compatibility: search.md
