# Adapted from collaboration-guidelines v5.0.0 templates/container/Taskfile.yml.
version: '3'
tasks:
  setup:
    desc: Build the development container and install locked dependencies
    cmds:
      - docker compose run --build --rm tooling task -t Taskfile.runtime.yml setup
  check:
    desc: Check library code inside the development container
    cmds:
      - docker compose run --rm tooling task -t Taskfile.runtime.yml check
  test:
    desc: Test the library inside the development container
    cmds:
      - docker compose run --rm tooling task -t Taskfile.runtime.yml test
  verify:
    desc: Check, test and generate API documentation inside the container
    cmds:
      - docker compose run --rm tooling task -t Taskfile.runtime.yml verify
  package:
    desc: Build wheel, source archive and Debian library inside the container
    cmds:
      - docker compose run --rm tooling task -t Taskfile.runtime.yml package
  smoke:
    desc: Install built libraries in clean Python and Debian containers
    platforms: [linux]
    cmds:
      - sh tools/smoke.sh
  docs:
    desc: Build the verified Markdown manual inside the development container
    cmds:
      - docker compose run --rm tooling task -t Taskfile.runtime.yml docs
  docs:test:
    desc: Exercise the manual inside the documentation browser container
    cmds:
      - docker compose run --build --rm documentation task -t Taskfile.runtime.yml docs:setup
      - docker compose run --rm documentation task -t Taskfile.runtime.yml docs:test
  reports:
    desc: Validate and summarize scenario outcomes in the development container
    cmds:
      - docker compose run --rm tooling task -t Taskfile.runtime.yml reports
