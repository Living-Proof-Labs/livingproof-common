[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "livingproof-common"
dynamic = ["version"]
description = "Shared version and build provenance libraries for Living Proof Labs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "build==1.3.0", "zensical==0.0.73", "coverage==7.10.7"]

docs-test = ["playwright==1.64.1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
norecursedirs = ["browser"]
markers = ["scenario(name): bounded consumer behavior scenario"]
[tool.ruff]
line-length = 100
